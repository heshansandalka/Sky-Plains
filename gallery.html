<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Lanka Nature</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-50">

    
    <nav class="w-full p-6 flex justify-between items-center bg-white shadow-sm px-12">
    <a href="index.html" class="text-2xl font-serif font-bold text-amber-900">Horton Plains Lanka</a>
    <div class="flex gap-8 font-medium text-gray-700">
        <a href="index.html" class="hover:text-amber-700">Home</a>
        <a href="gallery.html" class="text-amber-700 border-b-2 border-amber-700">Gallery</a>
        <a href="about.html" class="hover:text-amber-700">About Us</a> 
    </div>
</nav>
  <header class="py-16 px-4">
    <div class="max-w-4xl mx-auto text-center p-10 rounded-3xl bg-white/40 backdrop-blur-md border border-white/20 shadow-2xl shadow-amber-900/10 transition-all duration-500 hover:shadow-amber-900/20">
        
        <!-- Gradient Title -->
        <h1 class="text-5xl md:text-6xl font-serif bg-gradient-to-r from-amber-900 via-amber-700 to-amber-900 bg-clip-text text-transparent mb-4 animate-fade-in">
            Birds Gallery
        </h1>
        
        <p class="text-gray-600 text-lg mb-8 max-w-lg mx-auto leading-relaxed">
            Discover the hidden natural wonders and vibrant avian life of Sri Lanka through our curated collection.
        </p>

        <!-- Modern Button -->
        <button onclick="openUploadModal()" 
                class="group relative inline-flex items-center justify-center px-8 py-3 font-bold text-white transition-all duration-200 bg-amber-800 font-pj rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-900 hover:bg-amber-700 shadow-lg active:scale-95">
            <span class="mr-2">Add Photo</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>
</header>
    <main class="max-w-7xl mx-auto p-8">
        <div id="galleryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="aiModal" class="ai-modal">
        <div class="ai-content">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="uploadModal" class="ai-modal">
        <div class="ai-content text-center">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4">Upload to Gallery</h2>
            <div class="border-2 border-dashed border-gray-300 p-10 rounded-xl mb-4 bg-gray-50">
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                <label for="imageInput" class="cursor-pointer text-amber-700 font-semibold block">
                    📸 Click to Select Photo
                </label>
                <div id="previewContainer" class="mt-4 flex justify-center"></div>
            </div>
            <button onclick="saveImage()" class="bg-green-700 text-white px-8 py-2 rounded-full font-bold w-full">Post to eLanka</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
