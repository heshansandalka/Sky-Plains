<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Lanka Nature</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bg-stone-50 text-stone-900">

    <!-- Glowing Background Elements -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-amber-100/50 blur-[120px] -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-sky-100/50 blur-[120px] -z-10"></div>

  <nav class="w-full p-6 flex justify-between items-center bg-white shadow-sm px-12 relative">
    <div class="text-xl font-bold tracking-tighter">E<span class="text-amber-700">LANKA</span></div>
    
    <!-- Mobile Menu Button (Hamburger) -->
    <button class="mobile-menu-btn hidden flex-col gap-1.5 cursor-pointer" onclick="toggleMobileMenu()">
        <span class="w-6 h-0.5 bg-gray-800"></span>
        <span class="w-6 h-0.5 bg-gray-800"></span>
        <span class="w-6 h-0.5 bg-gray-800"></span>
    </button>

    <!-- Desktop Menu & Mobile Menu Content -->
    <div id="navLinks" class="flex gap-8 font-medium text-gray-700">
        <a href="index.html" class="text-amber-700 border-b-2 border-amber-700">Home</a>
        <a href="gallery.html" class="hover:text-amber-700">Gallery</a>
        <a href="about.html" class="hover:text-amber-700">About Us</a> 
    </div>
</nav>
    

    <main class="relative pt-20">
        <!-- Hero Section -->
        <section class="max-w-7xl mx-auto px-6 py-12 grid lg:grid-cols-2 gap-12 items-center">
            <div class="space-y-8 animate-fade-in">
                <div class="inline-block px-4 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold uppercase tracking-widest">
                    🍃 Nature's Paradise
                </div>
                <h1 class="text-6xl md:text-8xl font-black leading-[0.9] text-stone-900">
                    Endemic <span class="text-amber-700 italic">Birds</span> <br>
                    <span class="text-3xl md:text-5xl font-light text-stone-500">of Horton Plains</span>
                </h1>
                <p class="text-lg text-stone-600 max-w-md leading-relaxed">
                    Discover the rarest avian treasures hidden within the misty highlands of Sri Lanka. An immersive journey into biodiversity.
                </p>
                  <div class="flex flex-wrap justify-center gap-4 items-center mb-6">

     <div class="flex flex-wrap justify-center gap-4 items-center mb-6">
    <button onclick="openRoadMap()" class="flex items-center gap-2 bg-amber-700 text-white px-6 py-2 rounded-full font-semibold hover:bg-amber-800 transition-all">
        <img src="maps_96in128dp.png" alt="Google Maps" class="w-6 h-6 object-contain">
        Road map
    </button>

    <button onclick="openItinerary()" class="border-2 border-sky-700 text-sky-800 px-6 py-2 rounded-full font-semibold hover:bg-sky-50 transition-all">
        ✨ Plan Trip
    </button>
</div>
                </div>
            </div>

            <!-- Modern Bento Grid for Images -->
            <div class="grid grid-cols-12 grid-rows-6 gap-4 h-[600px] animate-float">
                <div class="col-span-8 row-span-4 rounded-3xl overflow-hidden shadow-2xl">
                    <img src="hortant4.jpg" class="w-full h-full object-cover hover:scale-110 transition duration-700">
                </div>
                <div class="col-span-4 row-span-2 rounded-3xl overflow-hidden shadow-xl">
                    <img src="01.jpg" class="w-full h-full object-cover">
                </div>
                <div class="col-span-4 row-span-4 rounded-3xl overflow-hidden shadow-xl">
                    <img src="horton3.jpg" class="w-full h-full object-cover">
                </div>
                <div class="col-span-8 row-span-2 rounded-3xl overflow-hidden shadow-xl">
                    <img src="Hortain (1).jpg" class="w-full h-full object-cover">
                </div>
            </div>
        </section>
    </main>

    <div id="aiModal" class="ai-modal">
        <div class="ai-content">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
